[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Pay Index API — documented stable paths per the methodology spec, backed
# by the netlify/functions/pay-index-*.mts handlers. Must come before the
# SPA fallback below, since redirects are matched in file order.
[[redirects]]
  from = "/api/index/current"
  to = "/.netlify/functions/pay-index-current"
  status = 200

[[redirects]]
  from = "/api/index/history"
  to = "/.netlify/functions/pay-index-history"
  status = 200

[[redirects]]
  from = "/api/basket"
  to = "/.netlify/functions/pay-index-basket"
  status = 200

[[redirects]]
  from = "/api/cells"
  to = "/.netlify/functions/pay-index-cells"
  status = 200

[[redirects]]
  from = "/api/coverage"
  to = "/.netlify/functions/pay-index-coverage"
  status = 200

# SPA fallback (safe even without a router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
